name = "bellatrix-worker"
compatibility_date = "2026-03-25"
main = "build/index.js"

[triggers]
crons = [ "*/30 * * * *"]

[[secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "f166f591426c40dfa7ce8ca71f6113ac"
secret_name = "GITHUB_TOKEN"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[env.dev.triggers]
crons = [ "* * * * *" ]

[[env.dev.secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "dfa7ce8ca71f6113acf166f591426c40"
secret_name = "GITHUB_TOKEN"
