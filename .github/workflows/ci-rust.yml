name: ci-rust

permissions:
  contents: read

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checking formatting of Rust code (rustfmt)
        run: cargo fmt --check

      - name: Checking smells in Rust code (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: $/.github/actions/setup-rust

      - name: Run project tests
        run: cargo xtask tests

  security:
    needs: [lint, tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check issues with supply chain
        run: cargo xtask security

  build-binaries:
    needs: [lint, tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]

    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: $/.github/actions/setup-rust
        with:
          install-extra-tools: true

      - name: Generates build artifacts
        run: cargo xtask artifacts binaries

      - name: Archive binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellatrix-binaries-${{ runner.os }}-${{ runner.arch }}
          path: artifacts

  binaries-extras:
    needs: build-binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch executable from previous build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: bellatrix-binaries-*

      - name: Setup Rust tools
        uses: $/.github/actions/setup-rust

      - name: Generate additional artifacts
        run: cargo xtask artifacts extras

      - name: Archive checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums.txt
          path: artifacts/checksums.txt

      - name: Archive SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}.json
          path: crates/bellatrix/bellatrix.cdx.json

  build-cloudflare-worker:
    needs: build-binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Project checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: $/.github/actions/setup-rust

      - name: Build Cloudflare Worker
        run: cargo xtask artifacts worker

      - name: Validate Worker configuration
        run: npx wrangler deploy -c crates/bellatrix-worker/wrangler.toml --dry-run
