name: ci-rust

permissions:
  contents: read

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checking formatting of Rust code (rustfmt)
        run: cargo fmt --check

      - name: Checking smells in Rust code (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: ./.github/actions/setup-rust

      - name: Run project tests
        run: cargo xtasks tests

  security:
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check issues with supply chain
        run: cargo xtasks security

  build-binaries:
    needs: [lint, tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-26 ]

    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: ./.github/actions/setup-rust
        with:
          install-extra-tools: true

      - name: Generates build artifacts
        run: cargo xtasks artifacts binaries

      - name: Archive binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bellatrix-binaries-${{ runner.os }}-${{ runner.arch }}
          path: artifacts

  binaries-extras:
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch executable from previous build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: bellatrix-binaries-*

      - name: Setup Rust tools
        uses: ./.github/actions/setup-rust

      - name: Generate additional artifacts
        run: cargo xtasks artifacts extras

      - name: Archive checksums
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checksums.txt
          path: artifacts/checksums.txt

      - name: Archive SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ github.sha }}.json
          path: crates/bellatrix/bellatrix.cdx.json

  publish-binaries:
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      local-registry:
        image: ghcr.io/kellnr/kellnr:5@sha256:1d8989771c3ce3f7d753f01f7859271c18fe18829e178666525c7e7f472f6f6f
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust tools
        uses: ./.github/actions/setup-rust

      - name: Publish on local registry
        run: cargo publish --workspace --registry local # zizmor: ignore[use-trusted-publishing]

  build-cloudflare-worker:
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Project checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Cloudflare worker
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked worker-build@0.7.5
          worker-build --release crates/bellatrix-worker
